name: Code quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: node --test tests/seller-description.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
