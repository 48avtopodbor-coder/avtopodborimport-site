name: Build & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 48avtopodbor-coder/avtopodborimport-site

jobs:
  build-and-push:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Prepare SSH key
        env:
          ENCODED_DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          umask 077
          printf '%s' "$ENCODED_DEPLOY_KEY" | base64 -d > "$RUNNER_TEMP/deploy_key"
          test -s "$RUNNER_TEMP/deploy_key"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key_path: /github/runner_temp/deploy_key
          fingerprint: SHA256:rbooscUe/XxjigRqK9bAvxK83GZNyB+PL35fM5czDKI
          timeout: 30s
          command_timeout: 3m
          script_stop: true
          script: |
            set -eu
            cd /opt/avtopodborimport
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
