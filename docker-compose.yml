version: "3.9"

services:
  web:
    image: ghcr.io/48avtopodbor-coder/avtopodborimport-site:latest
    container_name: avtopodbor-web
    restart: unless-stopped
    ports:
      # Только для nginx на этом же сервере. Без 127.0.0.1 Docker открывает
      # порт в интернет в обход UFW.
      - "127.0.0.1:3000:3000"
    env_file:
      - /opt/avtopodborimport/.env
    environment:
      - NODE_ENV=production
    # Защита на случай взлома приложения: писать на диск и запускать
    # свои программы изнутри контейнера нельзя, ресурсы ограничены.
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 1g
    cpus: 0.9
    networks:
      - avtopodbor

networks:
  avtopodbor:
    driver: bridge
