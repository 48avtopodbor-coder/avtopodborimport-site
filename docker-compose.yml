version: "3.9"

services:
  web:
    image: ghcr.io/48avtopodbor-coder/avtopodborimport-site:latest
    container_name: avtopodbor-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - /opt/avtopodborimport/.env
    environment:
      - NODE_ENV=production
    networks:
      - avtopodbor

networks:
  avtopodbor:
    driver: bridge
